name: essentials_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  # Record-level sync -- see CLAUDE.md "Syncing at the Record Level".
  # sqlite_crdt wraps sqflite/sqflite_common_ffi (both stay direct deps
  # above; DatabaseHelper still does the platform-conditional factory
  # selection, sqlite_crdt just sits on top of whichever Database it opens).
  sqlite_crdt: ^3.0.4
  crdt_sync: ^1.0.10
  # Direct dependency (not just via sqlite_crdt/crdt_sync) because
  # SyncService's safeChangesetBuilder writes its own ChangesetBuilder,
  # whose signature names Crdt/CrdtChangeset/Hlc directly -- see its doc
  # comment for why that override exists at all.
  crdt: ^5.1.3
  # sqlite_crdt always opens via sqflite_common_ffi's FFI factory, on every
  # platform including Android -- it has no native-sqflite code path at all
  # (confirmed by reading its source: is_web_io.dart's sqliteCrdtIsWeb is
  # unconditionally false on any non-web platform, so _open() always picks
  # databaseFactoryFfi, never plain sqflite's databaseFactory). FFI needs a
  # libsqlite3 to bind to; Android doesn't reliably expose one for arbitrary
  # dlopen across vendors/API levels, so this bundles one rather than
  # gambling on the system copy -- sqflite_common_ffi's own README
  # recommends this for any cross-platform (non-desktop-only) use.
  sqlite3_flutter_libs: ^0.5.34
  permission_handler: ^11.3.1
  trina_grid: ^2.2.2
  # Direct dependency (not just via trina_grid) because TrinaColumnType
  # .select's popup needs a ShadTheme ancestor -- see main.dart. Pinned to
  # match what trina_grid already resolves to, so this doesn't independently
  # drag in a second, possibly-incompatible shadcn_ui version.
  shadcn_ui: ^0.43.4
  url_launcher: ^6.3.2
  flutter_colorpicker: ^1.1.0
  # Pinned to a beta, not latest stable (11.0.3) -- stable predates the
  # Android fix ("Removed explicit Kotlin Gradle Plugin (KGP) application
  # ... to resolve warnings under AGP 9.0+", 12.0.0-beta.4's changelog)
  # this project's AGP 9.0.1 needs; without it, `flutter build apk` fails
  # with "cannot find symbol: class FilePickerPlugin" (KGP silently not
  # applied, so its Kotlin source never compiles). beta.7, not beta.8 --
  # beta.8's changelog exists on GitHub but isn't published to pub.dev yet
  # as of this writing; beta.7 already has the AGP9 fix (landed in
  # beta.4). Revisit once a stable release includes this fix.
  file_picker: 12.0.0-beta.7
  # Essentials v2 Phase 2 build order step 7 -- see
  # claude/essentials-v2-phase2-design.md's `barcode` entry and CLAUDE.md's
  # own Phase 2 Step 7 write-up for the spike this version was chosen
  # from. Android-only (bundles MLKit directly by default -- no Google
  # Play Services dependency, the exact risk the design doc flagged);
  # Windows has no plugin implementation at all, confirmed not to break
  # `flutter build windows` (federated plugin architecture -- an
  # unsupported platform is simply absent from
  # .flutter-plugins-dependencies, not a build error).
  mobile_scanner: ^7.4.0
  csv: ^8.0.0
  # Essentials v2 Phase 5 build order step 2 -- see
  # claude/essentials-v2-phase5-design.md's "Script safety" section for the
  # interrupt-hook question this dependency exists to resolve. QuickJS on
  # Android (FFI) and Windows (bundled quickjs-c-bridge shared library), no
  # sandboxing guarantee at the package level (the app's own script API
  # surface is the sandbox -- see JsEngine's doc comment). Confirmed via the
  # package's own changelog (0.7.2: "upgraded quickjs code to allow set
  # timeout") and source (QuickJsRuntime2's `timeout` ctor param is passed
  # straight into the native jsNewRuntime call, not wrapped in a Dart-side
  # Future/Timer) that `timeout` is a real QuickJS-level execution-interrupt
  # mechanism (JS_SetInterruptHandler), not just a future that abandons a
  # still-running isolate -- re-verified empirically, not just from docs,
  # via a real infinite-loop spike (see JsEngine's own doc comment).
  flutter_js: ^0.8.7
  # Direct dependency (not just transitively via sqlite3_flutter_libs/
  # sqflite_common_ffi) -- Essentials v2 Phase 5 build order step 3's
  # script API needs a genuinely SYNCHRONOUS SQLite read for `table('X')
  # .find()/.all()` inside a script's own synchronous JS execution (see
  # ScriptApiRuntime's own doc comment for why sqlite_crdt's async API
  # can't be used for this specific need). `package:sqlite3`'s Database
  # .select() is the real, non-async native call sqflite_common_ffi
  # itself sits on top of -- reads only, never writes (writes still go
  # through the real, correctly CRDT-stamped async SqliteCrdt API, same
  # as every other write in this app). Pinned to match what's already
  # resolved transitively so this doesn't independently drag in a second
  # version.
  sqlite3: ^3.5.0
  # Essentials v2 Phase 5 build order step 5's Script Editor UI -- per the
  # design doc's own confirmed decision, the package choice was
  # deliberately left for implementation time (same "check what's
  # actively maintained" call as mobile_scanner in Phase 2). Chosen:
  # `flutter_code_editor` (akvelon) -- pure Dart/Flutter (CodeController
  # extends TextEditingController directly, no native platform code at
  # all, unlike flutter_js/mobile_scanner -- confirmed via pub.dev, real
  # risk is low), Windows+Android both supported, JS highlighting via the
  # `highlight` package's language definitions. A plain monospace
  # TextField (the design doc's own explicitly-sanctioned fallback) stays
  # the fallback if this ever causes real friction -- syntax highlighting
  # is cosmetic, not a functional gap.
  flutter_code_editor: ^0.3.5
  # Direct dependency (not just transitively via flutter_code_editor) --
  # ScriptEditScreen imports langJavascript directly from
  # package:highlight/languages/javascript.dart for CodeController's
  # `language` parameter.
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
